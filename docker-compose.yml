version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-unilead}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unilead_dev}
      - POSTGRES_DB=${POSTGRES_DB:-unilead}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unilead} -d ${POSTGRES_DB:-unilead}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-unilead}:${POSTGRES_PASSWORD:-unilead_dev}@postgres:5432/${POSTGRES_DB:-unilead}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ENFORCE_JWT_SECRET=${ENFORCE_JWT_SECRET:-false}
      - LLM_PROVIDER_TYPE=${LLM_PROVIDER_TYPE:-mock}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
