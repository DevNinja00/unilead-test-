version: "3.9"

services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ENFORCE_JWT_SECRET=${ENFORCE_JWT_SECRET:-false}
      - LLM_PROVIDER_TYPE=${LLM_PROVIDER_TYPE:-mock}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
      - ENV=development
    volumes:
      - api-data:/app/apps/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
