[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-education"
version = "0.1.0"
description = "AI/Education subsystem of the AI Competency Coach (GenAI Hackathon 2026)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_education*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]